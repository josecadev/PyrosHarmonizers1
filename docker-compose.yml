# ==============================================================================
# PYROSHARMONIZER — DOCKER COMPOSE CONFIGURATION
# NASA International Space Apps Challenge 2026 — Reto #8
#
# Puertos expuestos:
#   - Backend API (FastAPI): http://localhost:5000 (Swagger: /docs)
#   - PostGIS Database:      localhost:5001 (PostgreSQL 16 + PostGIS 3.4)
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Base de Datos Geoespacial: PostgreSQL 16 + PostGIS 3.4
  # ---------------------------------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4
    container_name: pyros-postgis
    restart: unless-stopped
    ports:
      - "5001:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pyros_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pyros_password}
      POSTGRES_DB: ${POSTGRES_DB:-pyrosharmonizer_db}
    volumes:
      - pyros_postgis_data:/var/lib/postgresql/data
      - ./docs/pyrosharmonizer-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pyros_user} -d ${POSTGRES_DB:-pyrosharmonizer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pyros-network

  # ---------------------------------------------------------------------------
  # 2. Backend REST API: FastAPI + Uvicorn + Geospatial Engine
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pyros-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://pyros_user:pyros_password@postgis:5432/pyrosharmonizer_db
      - PORT=5000
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./datos:/app/datos
      - ./docs:/app/docs:ro
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - pyros-network

networks:
  pyros-network:
    driver: bridge

volumes:
  pyros_postgis_data:
    driver: local
